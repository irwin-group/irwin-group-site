# Checks Kent Irwin's ORCID record every Monday and adds new papers
# to the "Show all publications" list on publications.html.
name: Update publications from ORCID

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays, 14:00 UTC (6–7 am Pacific)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch new works from ORCID
        run: python3 scripts/update_publications.py
      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/all_pubs.json data/selected_pubs.json publications.html
            git commit -m "Auto-update publications from ORCID"
            git push
          fi
